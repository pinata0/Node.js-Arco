services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: arco
      POSTGRES_USER: arco
      POSTGRES_PASSWORD: arco_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arco -d arco"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
